[project]
name = "automated-research-agent"
version = "0.1.0"
description = "Agentic research CLI — AI-powered academic paper search with hallucination firewall"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.52.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "terminaltexteffects>=0.15.0",
    "pyzotero>=1.5.0",
]

[project.scripts]
ara = "ara.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
